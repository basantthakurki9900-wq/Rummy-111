<script type="text/javascript">
const { useState, useEffect, useRef, useCallback, useMemo } = React;
const SUITS = ["♠", "♥", "♦", "♣"];

// ✅ FIXED: showResultMark with amount display ABOVE the tick
window.showResultMark = function(type, amount) {
  const existing = document.getElementById('global-result-mark');
  if (existing) existing.remove();
  const overlay = document.createElement('div');
  overlay.id = 'global-result-mark';
  overlay.className = 'result-overlay';
  let winTextHtml = '';
  if (type === 'success' && amount && amount > 0) {
    const formattedAmount = Number(amount).toLocaleString('en-IN');
    winTextHtml = '<div class="win-amount-text"><small>WIN</small><strong>+₹' + formattedAmount + '</strong></div>';
  }
  overlay.innerHTML = '<div class="result-mark-wrapper">' + winTextHtml + '<div class="result-mark ' + type + '"><div class="mark-ring"></div><div class="mark-symbol">' + (type === 'success' ? '✓' : '✗') + '</div></div></div>';
  document.body.appendChild(overlay);
  setTimeout(() => { 
    const mark = overlay.querySelector('.result-mark'); 
    if (mark) mark.classList.add('fade-out'); 
    const wt = overlay.querySelector('.win-amount-text'); 
    if (wt) { wt.style.transition = 'opacity 0.4s'; wt.style.opacity = '0'; }
  }, 1500);
  setTimeout(() => { overlay.remove(); }, 2100);
};

function getDeviceId() {
  try {
    let deviceId = localStorage.getItem('tp_device_id');
    if (!deviceId) { 
      const fp = [
        navigator.userAgent || '',
        navigator.language || '',
        screen.width + 'x' + screen.height,
        screen.colorDepth || '',
        new Date().getTimezoneOffset(),
        navigator.hardwareConcurrency || 0,
        navigator.platform || ''
      ].join('|');
      let hash = 0;
      for (let i = 0; i < fp.length; i++) { const chr = fp.charCodeAt(i); hash = ((hash << 5) - hash) + chr; hash |= 0; }
      deviceId = 'DEV_' + Math.abs(hash).toString(36) + '_' + Date.now().toString(36);
      localStorage.setItem('tp_device_id', deviceId);
      try { localStorage.setItem('tp_device_fp', fp); } catch(e) {}
    }
    return deviceId;
  } catch(e) { return 'DEV_' + Date.now(); }
}

      (oldUserId ? '<div class="device-block-oldid"><small>पुरानी ID</small><strong>' + maskedId + '</strong></div>' : '') +
      '<button class="device-block-btn" onclick="document.getElementById(\'device-block-popup\').remove()">समझ गया</button>' +
    '</div>';
  document.body.appendChild(popup);
};

function getBotNames(count = 3) {
  let shuffled = [...BOT_NAMES];

function processZapUPIPayment(amount, user, onSuccess, onError) {
  if (!amount || amount <= 0) { window.showResultMark('failure'); return; }
  if (window.zapPollInterval) { clearInterval(window.zapPollInterval); window.zapPollInterval = null; }
  const currentOrderId = "ORD" + Date.now();

  window.handleZapSuccess = (orderId) => { if (window.zapPollInterval) clearInterval(window.zapPollInterval); window.zapPollInterval = null; onSuccess(orderId); };
  window.handleZapFailed = (orderId) => { if (window.zapPollInterval) clearInterval(window.zapPollInterval); window.zapPollInterval = null; window.showResultMark('failure'); onError(orderId); };
  window.handleZapTimeout = (orderId) => { window.showResultMark('failure'); };

  const checkOrderStatus = async () => {
    try {
      const response = await fetch('https://pay.zapupi.com/api/order-status', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ zap_key: "zap8c0d6927e12791628e9e4f545dc3f0e2", order_id: currentOrderId })
      });
      const data = await response.json();
      let payStatus = '';
      if (data) { payStatus = (data.payment_status || data.txn_status || (data.data && (data.data.payment_status || data.data.status)) || '').toString().toLowerCase(); }
      if (payStatus === 'success' || payStatus === 'paid' || payStatus === 'captured') {
        if (window.zapPollInterval) clearInterval(window.zapPollInterval);
        window.zapPollInterval = null;
        onSuccess(currentOrderId);
      } else if (payStatus === 'failed' || payStatus === 'cancelled' || payStatus === 'expired') {
        if (window.zapPollInterval) clearInterval(window.zapPollInterval);
        window.zapPollInterval = null;
        window.showResultMark('failure');
        onError(currentOrderId);
      }
    } catch (e) { console.error("Status polling error:", e); }
  };

  window.zapPollInterval = setInterval(checkOrderStatus, 5000);

  ZapUPI.createOrder(
    { zap_key: "zap8c0d6927e12791628e9e4f545dc3f0e2", order_id: currentOrderId, amount: amount.toString(), remark: user.name + " | " + user.id },
    {
      onResponse: function(paymentUrl, orderId, data) {
        if (paymentUrl) ZapUPI.loadPayment(paymentUrl);
        else { window.showResultMark('failure'); if (window.zapPollInterval) clearInterval(window.zapPollInterval); window.zapPollInterval = null; onError("No URL"); }
      },
      onError: function(err) {
        window.showResultMark('failure');
        if (window.zapPollInterval) clearInterval(window.zapPollInterval);
        window.zapPollInterval = null;
        onError(err);
      }
    }
  );
}

async function creditReferrer(referrerId, amount, historyEntry, fieldUpdates = {}) {

// Card Logic
function buildDeck() { const deck = []; for (const s of SUITS) for (let r = 2; r <= 14; r++) deck.push({ rank: r, suit: s }); return deck; }
function shuffle(deck) { const d = [...deck]; for (let i = d.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [d[i], d[j]] = [d[j], d[i]]; } return d; }
function evaluateHand(cards) { 
  if (!cards || cards.length === 0) return { category: 0, tiebreak: [0] };
  const ranks = [...cards.map((c) => c.rank)].sort((a, b) => b - a); 
  const suits = cards.map((c) => c.suit); 
  const isFlush = suits[0] === suits[1] && suits[1] === suits[2]; 
  const isTrail = ranks[0] === ranks[1] && ranks[1] === ranks[2]; 
  let isSeq = ranks[0] - ranks[1] === 1 && ranks[1] - ranks[2] === 1; 
  let seqVal = ranks[0]; 
  if (!isSeq && ranks[0] === 14 && ranks[1] === 3 && ranks[2] === 2) { isSeq = true; seqVal = 3; } 
  const isPair = !isTrail && (ranks[0] === ranks[1] || ranks[1] === ranks[2]); 
  let pairRank = 0, kicker = 0; 
  if (isPair) { if (ranks[0] === ranks[1]) { pairRank = ranks[0]; kicker = ranks[2]; } else { pairRank = ranks[1]; kicker = ranks[0]; } } 
  if (isTrail) return { category: 6, tiebreak: [ranks[0]] }; 
  if (isSeq && isFlush) return { category: 5, tiebreak: [seqVal] }; 
  if (isSeq) return { category: 4, tiebreak: [seqVal] }; 
  if (isFlush) return { category: 3, tiebreak: ranks }; 
  if (isPair) return { category: 2, tiebreak: [pairRank, kicker] }; 
  return { category: 1, tiebreak: ranks }; 
}
function compareHands(a, b) { const ea = evaluateHand(a), eb = evaluateHand(b); if (ea.category !== eb.category) return ea.category - eb.category; const len = Math.max(ea.tiebreak.length, eb.tiebreak.length); for (let i = 0; i < len; i++) { const av = ea.tiebreak[i] ?? 0, bv = eb.tiebreak[i] ?? 0; if (av !== bv) return av - bv; } return 0; }
function nextActiveIndex(players, from) { const n = players.length; for (let step = 1; step <= n; step++) { const i = (from + step) % n; if (!players[i].folded && !players[i].out) return i; } return from; }
function prevActiveIndex(players, from) { const n = players.length; for (let step = 1; step <= n; step++) { const i = (from - step + n * 2) % n; if (!players[i].folded && !players[i].out) return i; } return from; }
function activeList(players) { return players.filter((p) => !p.folded && !p.out); }

function getAAAHand(numPlayers) {
  let hands = [];
  hands[0] = [{ rank: 14, suit: "♠" }, { rank: 14, suit: "♥" }, { rank: 14, suit: "♦" }];
  const botCards = [
    [{ rank: 2, suit: "♣" }, { rank: 3, suit: "♠" }, { rank: 5, suit: "♥" }],
    [{ rank: 8, suit: "♥" }, { rank: 9, suit: "♦" }, { rank: 10, suit: "♣" }],
    [{ rank: 6, suit: "♠" }, { rank: 7, suit: "♥" }, { rank: 8, suit: "♦" }],
    [{ rank: 4, suit: "♣" }, { rank: 4, suit: "♠" }, { rank: 4, suit: "♥" }],
    [{ rank: 2, suit: "♦" }, { rank: 5, suit: "♣" }, { rank: 7, suit: "♠" }]
  ];
  for (let i = 1; i < numPlayers && i < 6; i++) hands[i] = botCards[i-1] || [{ rank: 2, suit: "♣" }, { rank: 3, suit: "♠" }, { rank: 5, suit: "♥" }];
  return { deck: hands.flat(), userWins: true, userHandStrength: 6, isAAA: true };
}
function getNormalDeck(numPlayers, userBalance, gamesPlayed) {
  let deck = shuffle(buildDeck());
  let hands = [];
  for (let i = 0; i < numPlayers; i++) hands.push([deck.pop(), deck.pop(), deck.pop()]);
  const userHandStrength = evaluateHand(hands[0]).category;
  let winChance = 0.50;
  if (userBalance > 2000) winChance = 0.18;
  else if (userBalance > 1000) winChance = 0.25;
  else if (userBalance > 500) winChance = 0.32;
  else if (userBalance > 200) winChance = 0.40;
  else if (userBalance > 50) winChance = 0.50;
  else winChance = 0.60;
  const userWins = Math.random() < winChance;
  let bestIdx = 0;
  let bestVal = evaluateHand(hands[0]).category;
  for (let i = 1; i < numPlayers; i++) {
    let val = evaluateHand(hands[i]).category;
    if (val > bestVal || (val === bestVal && compareHands(hands[i], hands[bestIdx]) > 0)) { bestVal = val; bestIdx = i; }
  }
  if (userWins && bestIdx !== 0) { let temp = hands[0]; hands[0] = hands[bestIdx]; hands[bestIdx] = temp; }
  else if (!userWins && bestIdx === 0) {
    let botIdx = Math.floor(Math.random() * (numPlayers - 1)) + 1;
    let temp = hands[0]; hands[0] = hands[botIdx]; hands[botIdx] = temp;
  }
  return { deck: hands.flat(), userWins, userHandStrength, isAAA: false };
}

function startRound(game, userBalance, gamesPlayed, isDemo = false, isPro = false) {
  const numPlayers = game.players.length;
  const botNames = getBotNames(numPlayers);
  let botIndex = 0;
  const playersWithNewNames = game.players.map((p) => {
    if (p.isBot) { const newName = botNames[botIndex % botNames.length]; botIndex++; return { ...p, name: newName, avatar: getBotAvatar() }; }
    return p;
  });
  let result;
  if (isDemo) { result = getAAAHand(numPlayers); }
  else {
    const gamesSinceLastWin = gamesPlayed % 20;
    if (gamesSinceLastWin > 12) result = getAAAHand(numPlayers);
    else result = getNormalDeck(numPlayers, userBalance, gamesPlayed);
  }
  let deck = result.deck;
  const userWins = result.userWins;
  const userHandStrength = result.userHandStrength || 0;
  const isAAA = result.isAAA || false;
  let idx = 0, pot = 0;
  const players = playersWithNewNames.map((p) => {
    if (p.chips <= 0 && !p.isBot) return { ...p, hand: [], folded: true, seen: false, out: true };
    const currentChips = p.isBot ? 9999999 : p.chips;
    const hand = [deck[idx++], deck[idx++], deck[idx++]];
    const bootPay = Math.min(game.bootAmount, currentChips);
    pot += bootPay;
    return { ...p, hand, folded: false, seen: false, out: false, chips: currentChips - bootPay };
  });
  const activeCount = players.filter((p) => !p.out).length;
  if (activeCount < 2) return mark({ ...game, players, phase: "gameover" }, "गेम समाप्त।", null);
  const dealer = game.roundNum % players.length;
  const firstTurn = nextActiveIndex(players, dealer);
  let g = { ...game, players, pot, stake: game.bootAmount, raises: 0, turn: firstTurn, phase: "playing", winnerInfo: null, roundNum: game.roundNum + 1, userWillWin: userWins, userHandStrength, isAAA, botMoveCount: 0 };
  g = mark(g, '— राउंड ' + g.roundNum + ' शुरू —', { type: "deal" });
  players.forEach((p, i) => { if (!p.out) g = mark(g, null, { type: "chip", idx: i, amount: game.bootAmount }); });
  return g;
}
function makeInitialGame(bootAmount, startChips, humanData, playerCount = 4) { 
  const botNames = getBotNames(playerCount);
  const players = [{ ...humanData, isBot: false, chips: startChips, hand: [], folded: false, seen: false, out: false }];
  for (let i = 1; i < playerCount; i++) {
    players.push({ id: 'bot' + i, name: botNames[i-1] || ('Bot' + i), avatar: getBotAvatar(), isBot: true, chips: 9999999, hand: [], folded: false, seen: false, out: false });
  }
  return {

    roundNum: 0, winnerInfo: null, events: [], _seq: 0, userWillWin: false, userHandStrength: 0, isAAA: false, botMoveCount: 0
  }; 
}
function pushLog(g, msg) { return { ...g, log: [...g.log.slice(-40), msg] }; }
function mark(g, msg, event) { let g2 = msg ? pushLog(g, msg) : g; if (event) { const seq = (g2._seq || 0) + 1; g2 = { ...g2, _seq: seq, events: [...(g2.events || []).slice(-30), { ...event, seq }] }; } return g2; }
function awardPot(game, winnerIdx, reason) { const players = game.players.map((p, i) => (i === winnerIdx ? { ...p, chips: p.chips + game.pot } : p)); let g = { ...game, players, phase: "roundEnd", winnerInfo: { idx: winnerIdx, reason } }; g = mark(g, '🏆 ' + players[winnerIdx].name + ' जीते!', { type: "win", idx: winnerIdx, amount: game.pot }); return g; }
function checkRoundEnd(game) { const active = activeList(game.players); if (active.length === 1) { const idx = game.players.findIndex((p) => p.id === active[0].id); return awardPot(game, idx, "सबने पैक किया"); } return null; }
function requiredAmount(player, stake) { return player.seen ? stake * 2 : stake; }
function doPack(game) { 
  const cur = game.turn; 
  let players = game.players.map((p, i) => (i === cur ? { ...p, folded: true } : p)); 
  let g = mark({ ...game, players }, players[cur].name + ' ने पैक किया।', { type: "pack", idx: cur }); 
  const ended = checkRoundEnd(g); if (ended) return ended; 
  const human = players[0];
  if (human.folded && !human.out) {
    const active = activeList(players);
    if (active.length === 2) {
      const botIdx = players.findIndex(p => p.isBot && !p.folded && !p.out);
      if (botIdx !== -1) { g = { ...g, turn: botIdx, botMoveCount: 1 }; return doShow(g); }
    }
  }
  return { ...g, turn: nextActiveIndex(players, cur) }; 
}
function doSee(game) { const cur = game.turn; const players = game.players.map((p, i) => (i === cur ? { ...p, seen: true } : p)); return mark({ ...game, players }, players[cur].name + ' ने पत्ते देखे।', { type: "peek" }); }
function doChaal(game, isRaise) { 
  const cur = game.turn; const p = game.players[cur]; const base = requiredAmount(p, game.stake); const amt = isRaise ? base * 2 : base; 
  if (amt > p.chips && !p.isBot) return doPack(game); 
  const finalAmt = Math.min(amt, p.chips); 
  const players = game.players.map((p2, i) => (i === cur ? { ...p2, chips: p2.chips - finalAmt } : p2)); 
  const pot = game.pot + finalAmt; 
  const canRaise = game.raises < 6; 
  const stake = isRaise && canRaise ? game.stake * 2 : game.stake; 
  const raises = isRaise && canRaise ? game.raises + 1 : game.raises; 
  let g = mark({ ...game, players, pot, stake, raises }, p.name + ' ने चाल खेली (' + finalAmt + ')।', { type: "chip", idx: cur, amount: finalAmt }); 
  const ended = checkRoundEnd(g); if (ended) return ended; 
  return { ...g, turn: nextActiveIndex(players, cur) }; 
}
function doShow(game) { 
  const active = activeList(game.players); if (active.length !== 2) return game; 
  const cur = game.turn; const p = game.players[cur]; const amt = Math.min(requiredAmount(p, game.stake), p.chips); 
  let players = game.players.map((p2, i) => (i === cur ? { ...p2, chips: p2.chips - amt } : p2)); 
  let pot = game.pot + amt; 
  const idxs = players.map((p2, i) => (!p2.folded && !p2.out ? i : -1)).filter((i) => i >= 0); 
  const [i1, i2] = idxs; 
  const cmp = compareHands(players[i1].hand, players[i2].hand); 
  const winIdx = cmp >= 0 ? i1 : i2; 
  let g = mark({ ...game, players, pot }, 'Show!', { type: "chip", idx: cur, amount: amt }); 
  return awardPot(g, winIdx, 'Show में जीत'); 
}
function doSideShow(game) { 
  const cur = game.turn; 
  const active = activeList(game.players); 
  if (active.length <= 2) return game; 
  const prevIdx = prevActiveIndex(game.players, cur); 
  const curP = game.players[cur], prevP = game.players[prevIdx]; 
  if (prevIdx === cur || !curP.seen || !prevP.seen) return game; 
  if (game.isAAA && prevP.isBot) { let g = mark(game, '❌ ' + prevP.name + ' ने Side Show रिजेक्ट किया!', { type: "pack" }); return { ...g, turn: nextActiveIndex(g.players, cur) }; }
  const amt = Math.min(requiredAmount(curP, game.stake), curP.chips); 
  let players = game.players.map((p, i) => (i === cur ? { ...p, chips: p.chips - amt } : p)); 
  let pot = game.pot + amt; 
  let g = mark({ ...game, players, pot }, 'Side Show मांगी!', { type: "chip", idx: cur, amount: amt }); 
  const cmp = compareHands(curP.hand, prevP.hand); 
  if (cmp < 0) { players = g.players.map((p, i) => (i === cur ? { ...p, folded: true } : p)); g = mark({ ...g, players }, curP.name + ' हारे (Side Show)।', { type: "pack", idx: cur }); } 
  else { players = g.players.map((p, i) => (i === prevIdx ? { ...p, folded: true } : p)); g = mark({ ...g, players }, prevP.name + ' हारे (Side Show)।', { type: "pack", idx: prevIdx }); } 
  const ended = checkRoundEnd(g); if (ended) return ended; 
  return { ...g, turn: nextActiveIndex(players, cur) };
